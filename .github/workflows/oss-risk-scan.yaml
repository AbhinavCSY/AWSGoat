name: OSS Risk Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  oss-risk-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Set up Python
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------
      # 3. Install OpenSSF Scorecard (FIXED)
      # ----------------------------------------
      - name: Install OpenSSF Scorecard
        shell: bash
        run: |
          set -e

          SCORECARD_VERSION="5.0.0"
          ASSET="score
