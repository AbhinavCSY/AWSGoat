name: OSS Risk Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  oss-risk-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenSSF Scorecard
        run: |
          SCORECARD_VERSION="v5.0.0"
          curl -L -o \
            https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard-linux-amd64
          sudo mv scorecard /usr/local/bin/
          scorecard --version

      - name: Install OSS Risk Scanner
        run: |
          pip install .

      - name: Run OSS Risk Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-risk-scan \
            --repo https://github.com/${{ github.repository }} \
            --token $GITHUB_TOKEN \
            --out oss-risk-report.json

      - name: Upload Risk Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-risk-report
          path: oss-risk-report.json
