name: OSS Risk Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  oss-risk-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      # ------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------
      # 3. Install OpenSSF Scorecard (STABLE METHOD)
      # ------------------------------------------------
      - name: Install OpenSSF Scorecard
        run: |
          set -e

          SCORECARD_VERSION="v5.0.0"

          echo "Downloading OpenSSF Scorecard ${SCORECARD_VERSION}"
          curl -L -o scorecard \
            https://github.com/ossf/scorecard/releases/download/${SCORECARD_VERSION}/scorecard-linux-amd64

          chmod +x scorecard
          sudo mv scorecard /usr/local/bin/scorecard

          echo "Installed Scorecard:"
          scorecard --version

      # ------------------------------------------------
      # 4. Install OSS Risk Scanner package
      # ------------------------------------------------
      - name: Install OSS Risk Scanner
        run: |
          pip install --upgrade pip
          pip install .

      # ------------------------------------------------
      # 5. Run OSS Risk Scan
      # ------------------------------------------------
      - name: Run OSS Risk Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oss-risk-scan \
            --repo https://github.com/${{ github.repository }} \
            --token $GITHUB_TOKEN \
            --out oss-risk-report.json

      # ------------------------------------------------
      # 6. Upload report as artifact
      # ------------------------------------------------
      - name: Upload Risk Report
        uses: actions/upload-artifact@v4
        with:
          name: oss-risk-report
          path: oss-risk-report.json

      # ------------------------------------------------
      # 7. (OPTIONAL) Fail build if OpenSSF score too low
      # -------------------------------
