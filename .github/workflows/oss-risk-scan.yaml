name: OpenSSF Scorecard Report

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scorecard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install OpenSSF Scorecard
      - name: Install OpenSSF Scorecard
        run: |
          set -e
          curl -fL https://github.com/ossf/scorecard/releases/download/v5.0.0/scorecard_5.0.0_linux_amd64.tar.gz -o scorecard.tgz
          tar -xzf scorecard.tgz
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          sudo chmod +x /usr/local/bin/scorecard
          scorecard version

      # Run Scorecard (JSON output)
      - name: Run OpenSSF Scorecard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard \
            --repo https://github.com/${{ github.repository }} \
            --format json \
            --out scorecard.json

      # Generate HTML report
      - name: Generate HTML report
        run: |
          python scripts/scorecard_to_html.py

      # Upload artifacts
      - name: Upload Scorecard Report
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-report
          path: |
            scorecard.json
            scorecard-report.html
