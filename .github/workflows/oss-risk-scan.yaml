name: OSS Package Risk Report (Scorecard)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scorecard:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ THIS IS THE SCORECARD RUNNER
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: scorecard.json
          results_format: json
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Convert Scorecard JSON → Markdown
        run: |
          SCORE=$(jq '.score' scorecard.json)

          cat << EOF > reports/oss-scorecard-report.md
          # OpenSSF Scorecard Report

          ## 🔐 Overall Score
          **Score:** ${SCORE}/10

          ## 📊 Checks Summary
          | Check | Score | Reason |
          |------|-------|--------|
          EOF

          jq -r '.checks[] | "| \(.name) | \(.score) | \(.reason) |"' scorecard.json \
            >> reports/oss-scorecard-report.md

          echo -e "\n_Generated on $(date -u)_\n" >> reports/oss-scorecard-report.md

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/oss-scorecard-report.md
          git commit -m "Add OpenSSF Scorecard report" || echo "No changes"
          git push
